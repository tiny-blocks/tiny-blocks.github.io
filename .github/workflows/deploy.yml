name: Deploy site

# The site reads every library from its repository and from Packagist when it is built, so it is built
# again every day to pick up new releases, besides every change to this repository. A library can also
# ask for a build right after a release with a repository_dispatch of type library-released.
on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types:
      - library-released

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pages: write
  contents: read
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment:
      url: ${{ steps.deployment.outputs.page_url }}
      name: github-pages
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
